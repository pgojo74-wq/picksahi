[build]
  command = "npm ci && npm --prefix backend ci && if [ -n \"$ADMIN_PASSWORD\" ]; then npm --prefix backend run db:migrate; fi && npm --prefix backend run prepare:netlify && npm --prefix backend run build"
  publish = "netlify-site"
  functions = "backend/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
